<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in – FindIt</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css"></head>
<body>
<main class="wrap narrow">
  <h2 id="ttl">Sign in</h2>
  <p class="muted">An account lets you manage your posts and read messages from finders and owners.</p>
  <div class="seg tabs"><button class="btn" id="tin" type="button">Sign in</button><button class="btn ghost" id="tup" type="button">Create account</button></div>
  <form id="f" class="authf">
    <label id="nm" hidden>Full name<input name="name"></label>
    <label>University email<input type="email" name="email" required autocomplete="email"></label>
    <label>Password<input type="password" name="password" required minlength="8" autocomplete="current-password"></label>
    <p id="err" class="err" role="alert"></p>
    <button class="btn dark" id="go">Sign in</button>
  </form>
  <p class="muted small">Use your university email. Your contact details are never shown publicly.</p>
</main>
<script src="/js/common.js"></script>
<script src="/js/login.js"></script></body></html>
